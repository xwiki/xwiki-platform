### Wiki macros classes
XWiki.WikiMacroClass_id=Makro-id
XWiki.WikiMacroClass_id_hint=Makroens id er også det, der bruges i syntaksen, fx {{yourId /}}.
XWiki.WikiMacroClass_name=Makronavn
XWiki.WikiMacroClass_name_hint=Makroens navn, som vises i editorens brugerflade.
XWiki.WikiMacroClass_description=Makrobeskrivelse
XWiki.WikiMacroClass_description_hint=Makroens beskrivelse, som vises i editorens brugerflade.
XWiki.WikiMacroClass_defaultCategory=Standardkategori
XWiki.WikiMacroClass_defaultCategory_hint=Den kategori, som makroen vises under i editorens brugerflade.
XWiki.WikiMacroClass_supportsInlineMode=Understøtter inline-tilstand
XWiki.WikiMacroClass_supportsInlineMode_hint=Hvis nej, viser makroen en fejl, når den bruges inline.
XWiki.WikiMacroClass_visibility=Makroens synlighed
XWiki.WikiMacroClass_visibility_Current\ User=Aktuel bruger
XWiki.WikiMacroClass_visibility_Current\ Wiki=Aktuel wiki
XWiki.WikiMacroClass_visibility_Global=Global
XWiki.WikiMacroClass_contentType=Makroens indhold
XWiki.WikiMacroClass_contentOrder=Indholdets placering i rækkefølgen
XWiki.WikiMacroClass_contentOrder_hint=Angiv, hvor indholdsparameteren skal vises i forhold til wikimakroens andre parametre i konfigurationens brugerflade.
XWiki.WikiMacroClass_contentType_Optional=Valgfrit
XWiki.WikiMacroClass_contentType_Mandatory=Obligatorisk
XWiki.WikiMacroClass_contentType_No\ content=Intet indhold
XWiki.WikiMacroClass_contentJavaType=Indholdstype
XWiki.WikiMacroClass_contentJavaType_Wiki=Wiki
XWiki.WikiMacroClass_contentJavaType_Unknown=Ukendt
XWiki.WikiMacroClass_contentDescription=Beskrivelse af indholdet (gælder ikke for typen "Intet indhold")
XWiki.WikiMacroClass_code=Makrokode
XWiki.WikiMacroClass_async_enabled=Asynkron gengivelse
XWiki.WikiMacroClass_async_cached=Mellemlagret
XWiki.WikiMacroClass_async_context=Kontekstelementer
XWiki.WikiMacroClass_priority=Prioritet
XWiki.WikiMacroClass_executionIsolated=Udførelsen er isoleret
XWiki.WikiMacroClass_executionIsolated_hint=Markér feltet, hvis makroens udførelse ikke ændrer XDOM (heller ikke via direkte udførelse af andre makroer, fx fortolket fra indholdet eller fra en anden side). Det er i orden at læse XDOM og at læse og skrive andre kontekstoplysninger. Når makroens udførelse markeres som isoleret, udføres makroer hurtigere.
XWiki.WikiMacroParameterClass_name=Parameternavn
XWiki.WikiMacroParameterClass_name_hint=Parameterens navn er det, der bruges i syntaksen, fx {{yourMacro paramName="xx" /}}. Du kan bruge en oversættelsesnøgle som rendering.macro.yourMacro.parameter.paramName.name for at ændre det navn, der vises i editorens brugerflade.
XWiki.WikiMacroParameterClass_description=Parameterbeskrivelse
XWiki.WikiMacroParameterClass_description_hint=Parameterens beskrivelse. Den kan også oversættes med en nøgle som rendering.macro.yourMacro.parameter.paramName.description
XWiki.WikiMacroParameterClass_mandatory=Obligatorisk parameter
XWiki.WikiMacroParameterClass_mandatory_hint=Hvis ja, skal parameterens værdi angives, ellers er parameteren valgfri. Bemærk, at det kan påvirke parameterens synlighed.
XWiki.WikiMacroParameterClass_defaultValue=Parameterens standardværdi
XWiki.WikiMacroParameterClass_defaultValue_hint=Standardværdien bør kun bruges til valgfrie parametre, så det ikke er nødvendigt at angive en værdi, når makroen bruges. Den skal ikke opfattes som en pladsholder for en værdi i editorens brugerflade.
XWiki.WikiMacroParameterClass_type=Parametertype
XWiki.WikiMacroParameterClass_type_hint=Ukendt betyder, at værdien behandles som en String-værdi, og Wiki betyder, at sidens wikisyntaks bruges. Desuden kan du angive en hvilken som helst brugerdefineret type, hvis du angiver dens fuldt kvalificerede navn, fx java.util.List.
XWiki.WikiMacroParameterClass_feature=Parameterens funktion
XWiki.WikiMacroParameterClass_feature_hint=Parametre, der er knyttet til samme funktion, udelukker hinanden. Bemærk, at en funktion kan knyttes til en gruppe: I så fald knyttes alle parametre i samme gruppe til samme funktion.
XWiki.WikiMacroParameterClass_group=Parametergruppe
XWiki.WikiMacroParameterClass_group_hint=Gør det muligt at samle parametre visuelt i brugerfladen.
XWiki.WikiMacroParameterClass_deprecated=Forældet parameter
XWiki.WikiMacroParameterClass_hidden=Skjult parameter
XWiki.WikiMacroParameterClass_hidden_hint=Hvis ja, vises parameteren aldrig i editorens brugerflade, men den kan stadig bruges i syntaksen.
XWiki.WikiMacroParameterClass_advanced=Avanceret parameter
XWiki.WikiMacroParameterClass_advanced_hint=Hvis ja, placeres parameteren altid i et sammenfoldet afsnit i editorens brugerflade.
XWiki.WikiMacroParameterClass_featureMandatory=Funktionen er obligatorisk.
XWiki.WikiMacroParameterClass_featureMandatory_hint=Hvis ja, skal en af parametrene bruges, selv om alle parametre, der er knyttet til funktionen, er valgfrie.
XWiki.WikiMacroParameterClass_order=Parameterens placering i rækkefølgen
XWiki.WikiMacroParameterClass_order_hint=Angiv parameterens placering i makroens konfigurationsbrugerflade: jo lavere værdi, jo højere oppe vises den.
rendering.wikimacro.error.failedResolveContentPlaceholder=Pladsholderen for makroens indhold kunne ikke fortolkes
rendering.wikimacro.error.failedResolveParameterPlaceholder=Pladsholderen for makroens parameter kunne ikke fortolkes
rendering.wikimacro.requiredrights.global=En wikimakro med global synlighed kræver programmeringsrettigheder.
rendering.wikimacro.requiredrights.wiki=En wikimakro med synlighed for wikien kræver administratorrettigheder til wikien.
