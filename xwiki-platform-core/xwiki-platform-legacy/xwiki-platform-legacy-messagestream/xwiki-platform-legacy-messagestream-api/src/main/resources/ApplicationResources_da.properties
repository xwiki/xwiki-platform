rendering.macro.messageSender.parameter.visibility.name=visibility
rendering.macro.messageSender.parameter.visibility.description=Den synlighed, der er valgt som standard, når makroen vises.\nHvis den ikke er angivet, bestemmes den automatisk ud fra den side, hvor makroen bruges.\nGyldige værdier er: 'everyone', 'followers', 'group' eller 'user'.
rendering.macro.messageSender.parameter.visibilityParameter.name=visibilityParameter
rendering.macro.messageSender.parameter.visibilityParameter.description=Nogle synlighedsniveauer (fx 'user' og 'group') kan have en parameter. For de to nævnte niveauer kan værdien være en serialiseret reference til en bruger- eller gruppeside.
rendering.macro.messageSender.parameter.visibilityOptions.name=visibilityOptions
rendering.macro.messageSender.parameter.visibilityOptions.description=Kommasepareret liste over de synlighedsindstillinger, som makroen skal lade brugeren vælge imellem.\nListen skal være en delmængde af standardindstillingerne: 'everyone', 'followers', 'group', 'user'.
