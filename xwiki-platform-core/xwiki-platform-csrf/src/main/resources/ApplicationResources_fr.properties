csrf.error.title=Sécurité & Validation de session
csrf.error.message=Cette requête a été rejetée en raison d'informations d'authentification non valides.
csrf.error.causes.introduction=Les causes possibles sont :
csrf.error.causes.stalesession=Session périmée : le serveur a été redémarré, ou vous vous êtes déconnecté dans un autre onglet de navigateur
csrf.error.causes.forgedrequest=Requête forgée : quelqu'un essaie d'effectuer une action en votre nom
csrf.error.resubmit.question=Souhaitez-vous re-soumettre la requête\u202F?
csrf.error.resubmit.question.no=Non, annuler.
csrf.error.resubmit.question.yes=Oui re-soumettre la requête, j'accepte les risques.
csrf.confirmation.status=Les informations d'authentification dans cette requête ne sont pas valides.
csrf.confirmation.possibleReasons.description=Cela pourrait arriver dans les cas suivants :
csrf.confirmation.possibleReasons.firstReason=Vous avez laissé l'éditeur ouvert dans une autre fenêtre / un autre onglet et vous êtes déconnecté et reconnecté de nouveau
csrf.confirmation.possibleReasons.secondReason=Votre jeton d'authentification a expiré en raison d'une trop longue période d'inactivité
csrf.confirmation.possibleReasons.thirdReason=Quelqu'un a tenté de réaliser une attaque CSRF
csrf.confirmation.noResubmit=Vous êtes invité à vous rendre sur la page précédente, la recharger et essayer à nouveau de réaliser l'action que vous vouliez exécuter.
csrf.confirmation.unsure=Si vous êtes sûr qu''aucune de ces situations ne s''applique dans votre cas, vous pourriez avoir trouvé un bug. Nous sommes désolés pour cela, merci de le signaler sur {0}XWiki JIRA{1}.
csrf.confirmation.question=Voulez-vous renvoyer la requête\u202F? Si vous n''êtes pas sûr, répondez {0}Non{1}.
