csrf.error.title=Validering af sikkerhed og session
csrf.error.message=Anmodningen er afvist på grund af ugyldige godkendelsesoplysninger.
csrf.error.causes.introduction=Mulige årsager:
csrf.error.causes.stalesession=Forældet session: Serveren er genstartet, eller du er logget ud i en anden fane i browseren
csrf.error.causes.forgedrequest=Forfalsket anmodning: Nogen prøver at udføre en handling på dine vegne
csrf.error.resubmit.question=Vil du sende anmodningen igen?
csrf.error.resubmit.question.no=Nej, annuller.
csrf.error.resubmit.question.yes=Ja, jeg kender risikoen. Send anmodningen igen
csrf.confirmation.status=Anmodningen indeholder ugyldige godkendelsesoplysninger.
csrf.confirmation.possibleReasons.description=Det kan ske i følgende situationer:
csrf.confirmation.possibleReasons.firstReason=Du lod editoren stå åben i et andet vindue eller en anden fane og loggede ud og ind igen
csrf.confirmation.possibleReasons.secondReason=Dit godkendelsestoken er udløbet efter lang tids inaktivitet
csrf.confirmation.possibleReasons.thirdReason=Nogen har forsøgt et CSRF-angreb
csrf.confirmation.noResubmit=Gå tilbage til den forrige side, genindlæs den, og prøv at udføre handlingen igen.
csrf.confirmation.unsure=Hvis du er sikker på, at ingen af situationerne passer på dig, har du måske fundet en fejl. Det beklager vi. Rapportér den på {0}XWiki JIRA{1}.
csrf.confirmation.question=Vil du sende anmodningen igen? Hvis du er i tvivl, så svar {0}Nej{1}.
