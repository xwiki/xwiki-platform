extension.security.analysis.advice.upgradeFromEM=Når der kommer en ny version med en rettelse, kan udvidelsen opgraderes fra {0}.
extension.security.analysis.advice.upgradeFromEM.0=Udvidelseshåndtering
extension.security.analysis.advice.transitive=Udvidelsen er installeret, fordi en anden udvidelse kræver den. Det frarådes at opgradere den manuelt. Opgrader i stedet den udvidelse, der kræver den. De er vist nedenfor.
extension.security.analysis.advice.upgradeXWiki=Udvidelsen leveres direkte af XWiki og kan ikke opgraderes med Udvidelseshåndtering. Hold øje med nye versioner af XWiki. Tjek i udgivelsesnoterne, om udvidelsen er opgraderet til en version med en sikkerhedsrettelse.
extension.security.analysis.advice.upgradeEnvironment=Hold øje med nye versioner af dit miljø (fx servlet-motor) med en sikkerhedsrettelse, og opgrader derefter.
