security.authentication.migration1400600000XWIKI19869.email.content=Kære bruger \n\nPå grund af en fejl blev din adgangskode gemt som almindelig tekst i vores wiki. Vi kan ikke udelukke, at din adgangskode er blevet lækket. Du får derfor måske en e-mail mere, hvor du kan vælge en ny adgangskode. \nKontakt administratoren, hvis der opstår problemer, eller hvis du har spørgsmål.
