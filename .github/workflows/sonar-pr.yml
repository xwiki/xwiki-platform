## Analyze each pull request with SonarCloud and fail when a line the pull request writes carries a
## SonarQube issue, so that a change introducing one is caught before it is merged instead of turning
## the master quality gate red afterwards. This is not a duplicate of the ci.xwiki.org "quality"
## build: that one analyzes master after the merge, with the tests and the coverage, whereas this one
## only needs the bytecode of the changed code.
name: SonarCloud PR analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

## One analysis per pull request: a new commit makes the running one obsolete.
concurrency:
  group: sonar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Analyze
    ## A pull_request run from a fork gets no repository secrets, so the analysis has no token to
    ## authenticate with. Skip those rather than fail them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    ## The profiles every Maven command of this job uses, the module selection included, so that the
    ## reactor the selection reasons about cannot drift from the reactor Maven builds. They have to
    ## cover every module the ci.xwiki.org "quality" build analyzes master with, because a module
    ## missing from this build is a module whose new code no pull request gate ever sees: the -legacy
    ## modules are analyzed there and legacy is what puts them in the reactor. The profiles adding
    ## the modules that exist to run the functional tests, integration-tests and docker and
    ## distribution, are deliberately left out: master is not analyzed with them either. And
    ## snapshot supplies the XWiki repositories that a runner, having no settings.xml, cannot
    ## declare.
    env:
      MAVEN_PROFILES: snapshot,legacy
    steps:
      - uses: actions/checkout@v7
        with:
          ## SonarCloud derives the lines the pull request changed from the git history, and the
          ## module selection below diffs against the base branch.
          fetch-depth: 0

      ## The JDK to build with is the one the branch targets, which is the xwiki.java.version property
      ## of the effective root pom. It is read with Maven rather than searched for in the pom text
      ## because the property is not necessarily declared in the repository being built: xwiki-rendering
      ## and xwiki-platform inherit it from the xwiki-commons parent, which Maven has to download to
      ## know it. -N keeps the evaluation to the root pom, and the profiles supply the XWiki
      ## repositories that parent is downloaded from. The JDK preinstalled on the runner is enough to
      ## run this: the goal builds the pom model, it compiles nothing.
      - name: Read the Java version of the branch
        id: java
        run: |
          VERSION=$(mvn -N -B -ntp -q -DforceStdout -P"$MAVEN_PROFILES" help:evaluate \
            -Dexpression=xwiki.java.version)
          ## An undefined property makes help:evaluate print a message and still succeed, which would
          ## otherwise surface as an obscure setup-java failure.
          if [[ ! "$VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to read xwiki.java.version from the root pom, got [$VERSION]"
            exit 1
          fi
          echo "Building with Java $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: maven

      ## A pull request analysis only ever reports on the pull request's own new code, and every
      ## condition of the XWiki quality gate is on a new code metric, so a module the pull request does
      ## not change can neither contribute an issue nor fail the gate. Building and scanning the whole
      ## reactor to analyze the few modules a pull request touches is therefore wasted work: the
      ## modules owning the changed files are selected instead, and the rest of the reactor is resolved
      ## from the snapshots the CI publishes rather than rebuilt. An empty selection means the whole
      ## reactor, which is the fallback whenever the change cannot be narrowed down.
      - name: Select the modules the pull request changes
        id: modules
        ## A branch name is chosen by whoever opens the pull request and ${{ }} is substituted into the
        ## script before the shell runs it, so the base branch goes through the environment instead.
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! git rev-parse --verify --quiet "origin/$PR_BASE" > /dev/null; then
            echo "Base branch [$PR_BASE] is not in the clone, building the whole reactor"
            echo "list=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ## The reactor is derived from the poms rather than from a Maven pass over the modules,
          ## which costs minutes for what amounts to reading the <module> elements. It is read as XML
          ## and not as text because a pom holds <profiles> and <module> elements inside comments,
          ## which a text scan takes for real ones, and because a construct this cannot model has to
          ## be recognized to fall back on the whole reactor instead of silently leaving a module out.
          LIST=$(python3 - "$(git merge-base "origin/$PR_BASE" HEAD)" <<'PYTHON'
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          ## Maven's own namespace: an element outside of it is not the element it looks like.
          NS = '{http://maven.apache.org/POM/4.0.0}'
          BASE = sys.argv[1]
          PROFILES = {profile for profile in os.environ['MAVEN_PROFILES'].split(',') if profile}


          class Unmodelled(Exception):
              """A pom uses a construct this selection does not model, so no reactor can be derived
              from it."""


          def log(message):
              print(message, file=sys.stderr)


          def git(*arguments):
              result = subprocess.run(('git',) + arguments, stdout=subprocess.PIPE,
                                      stderr=subprocess.DEVNULL)
              if result.returncode != 0:
                  raise OSError(' '.join(arguments))
              return result.stdout


          def pom_path(directory):
              return 'pom.xml' if directory == '.' else directory + '/pom.xml'


          def read_pom(path):
              """The pom as XML, from the working tree, or from git when the pull request deleted
              it. None when no version of it can be parsed."""
              readers = (lambda: open(path, 'rb').read(), lambda: git('show', 'HEAD:' + path),
                         lambda: git('show', BASE + ':' + path))
              for read in readers:
                  try:
                      pom = ET.fromstring(read())
                  except (OSError, ET.ParseError):
                      continue
                  if pom.tag != NS + 'project':
                      raise Unmodelled('[%s] is not in the Maven 4.0.0 namespace' % path)
                  return pom
              return None


          def listed_modules(element):
              modules = element.find(NS + 'modules')
              if modules is None:
                  return []
              return [module.text.strip() for module in modules.findall(NS + 'module')
                      if module.text and module.text.strip()]


          def declared_modules(pom):
              """The modules a pom contributes to the reactor of a build activating PROFILES, and
              the ones it may contribute. Certain are the modules declared outside of any profile
              and the ones declared by a profile named on the command line. Undecided are the
              modules of a profile carrying an <activation>, which Maven turns on by itself on a
              property, the operating system, the presence of a file or by default: they are kept
              out of the reactor, the way a build setting none of that leaves them out, and reported
              so that a change actually touching one of them can be widened to the whole reactor."""
              certain = listed_modules(pom)
              undecided = []
              profiles = pom.find(NS + 'profiles')
              for profile in [] if profiles is None else profiles.findall(NS + 'profile'):
                  declared = listed_modules(profile)
                  if not declared:
                      continue
                  if (profile.findtext(NS + 'id') or '').strip() in PROFILES:
                      certain += declared
                  elif profile.find(NS + 'activation') is not None:
                      undecided += declared
              return certain, undecided


          def build_reactor():
              """Every module directory of the reactor, mapped to the directory of the module that
              declares it, along with the directories a profile Maven decides on by itself may add
              to it. A <module> is resolved as a path the way Maven resolves it, so a module
              declared as a nested or a relative path is followed as well."""
              parents = {'.': None}
              undecided = set()
              pending = ['.']
              while pending:
                  directory = pending.pop()
                  pom = read_pom(pom_path(directory))
                  if pom is None:
                      raise Unmodelled('[%s] cannot be read' % pom_path(directory))
                  certain, maybe = declared_modules(pom)
                  for module in certain:
                      child = os.path.normpath(os.path.join(directory, module))
                      if child not in parents:
                          parents[child] = directory
                          pending.append(child)
                  undecided.update(os.path.normpath(os.path.join(directory, module))
                                   for module in maybe)
              return parents, undecided


          def ancestors(directory):
              """The directory and every directory holding it, up to the repository root."""
              while directory and directory != '.':
                  yield directory
                  directory = os.path.dirname(directory)


          def owning_project(path):
              """The directory of the Maven project a file belongs to, which is its closest ancestor
              holding a pom.xml, the way Maven decides it."""
              directory = os.path.dirname(path)
              while True:
                  if os.path.isfile(pom_path(directory or '.')):
                      return directory or '.'
                  if not directory:
                      return None
                  directory = os.path.dirname(directory)


          def whole_reactor(reason):
              log('Building the whole reactor because %s' % reason)
              print('')
              return 0


          def main():
              ## -z keeps git from quoting a path holding a character it considers unusual, and a
              ## quoted path is a path no walk up the directories can resolve.
              changed = git('diff', '-z', '--name-only', BASE, 'HEAD')
              changed = [path for path in changed.decode('utf-8', 'surrogateescape').split('\0')
                         if path]
              try:
                  reactor, undecided = build_reactor()
              except Unmodelled as reason:
                  return whole_reactor('the reactor cannot be derived: %s' % reason)

              selected = set()
              for path in changed:
                  directory = owning_project(path)
                  ## A file no project holds has nothing to compile or analyze.
                  if directory is None:
                      continue
                  ## A module that only a profile this build leaves out activates -- a functional
                  ## test module, a distribution module -- is not in the reactor, so -pl would
                  ## reject its path, and the master analysis does not cover it either, so leaving
                  ## it out changes nothing. The same goes for the pom.xml a module ships as a test
                  ## resource, which is not a module at all.
                  if directory not in reactor:
                      ## Unless a profile Maven decides on by itself declares the module, in which
                      ## case whether the reactor holds it is exactly what is not known.
                      held = next((d for d in ancestors(directory) if d in undecided), None)
                      if held is not None:
                          return whole_reactor('[%s] belongs to [%s], which a profile Maven decides '
                                               'on by itself declares' % (path, held))
                      log('Ignoring [%s]: no module of the reactor this workflow builds owns it'
                          % path)
                      continue
                  ## A changed pom selects its own module and nothing more, the root pom and an
                  ## aggregator included, even though those drive the modules below them. Every
                  ## condition of the quality gate is on a new code metric, and the new code a pom
                  ## change brings is that pom's own lines, which are analyzed with the module
                  ## holding them: a module the pull request does not change owns no new line, so
                  ## building its subtree produces nothing the gate can read.
                  ## Every ancestor is selected along with the module because sonar:sonar rebuilds
                  ## the project tree out of the reactor and fails the analysis with "<module> is
                  ## orphan" when a selected module's parent is missing from it.
                  while directory != '.':
                      selected.add(directory)
                      directory = reactor[directory]

              ## The root is always selected: sonar:sonar is an aggregator goal, so it runs on the
              ## top level project of the reactor and fails with "Maven session does not declare a
              ## top level project" without one. It is also where the analyzed sonar.projectKey
              ## comes from.
              listing = ['.'] + sorted(selected)
              log("Building %d of the reactor's %d modules:" % (len(listing), len(reactor)))
              for directory in listing:
                  log('  ' + directory)
              print(','.join(listing))
              return 0


          sys.exit(main())
          PYTHON
          )
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      ## Compile only. The analysis needs the bytecode, not the test results, and no coverage: the
      ## verdict is on the issues the pull request's own lines carry. The profiles
      ## are what supplies the XWiki repositories the parent pom, the snapshots of the other XWiki
      ## repositories and the modules left out of the selection are downloaded from, a runner having
      ## no settings.xml declaring them.
      - name: Build
        env:
          MODULES: ${{ steps.modules.outputs.list }}
        run: >
          mvn -B -ntp -T 1C install -DskipTests -P"$MAVEN_PROFILES" ${MODULES:+-pl "$MODULES"}
          -Dxwiki.checkstyle.skip=true -Dxwiki.revapi.skip=true
          -Dxwiki.enforcer.skip=true -Dxwiki.spoon.skip=true

      ## This publishes the analysis and nothing more: sonar.qualitygate.wait is deliberately not
      ## asked for, because it would make the job's verdict the project's quality gate, which is the
      ## wrong verdict for a pull request. What the job fails on is decided by the step below.
      ## The pull request properties go through the environment rather than being interpolated into the
      ## command: a branch name is chosen by whoever opens the pull request, and ${{ }} is substituted
      ## into the script before the shell runs it, so interpolating one lets a crafted branch name run
      ## commands on the runner, where the token is.
      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          MODULES: ${{ steps.modules.outputs.list }}
        run: >
          mvn -B -ntp sonar:sonar -P"$MAVEN_PROFILES" ${MODULES:+-pl "$MODULES"}
          -Dsonar.pullrequest.key="$PR_KEY"
          -Dsonar.pullrequest.branch="$PR_BRANCH"
          -Dsonar.pullrequest.base="$PR_BASE"

      ## The verdict, which the project's quality gate cannot give. On a pull request SonarCloud
      ## counts every issue it reports in a changed file towards the new code metrics the gate is
      ## made of, whatever line the issue sits on, so a pull request editing one line of a file
      ## inherits the issues that file already had and fails a gate none of its own lines made red.
      ## The pull request is judged on the lines it writes instead: every issue the analysis reports
      ## is kept only when it points at one of them, and any issue that passes that filter fails the
      ## job, whatever its severity, since a pull request has no reason to write a line SonarQube
      ## has something to say about. The conditions of the gate that are not about issues are lost
      ## with it, and deliberately: the coverage is not measured by this build at all, and the
      ## duplication of new code is a ratio that a handful of changed lines is enough to blow past.
      ## Security hotspots are not part of the verdict either: they ask for a human review, which
      ## cannot happen between the analysis and the merge.
      - name: Fail on the issues the pull request introduces
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_KEY: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          import time
          import urllib.parse
          import urllib.request


          def read_report_task():
              """Where the scanner published and what it published. It is read rather than declared
              because this workflow is the same file in every XWiki repository, so it cannot name a
              server or a project key of its own."""
              properties = {}
              with open('target/sonar/report-task.txt', encoding='utf-8') as report:
                  for line in report:
                      key, separator, value = line.strip().partition('=')
                      if separator:
                          properties[key] = value
              return properties


          TASK = read_report_task()
          SERVER = TASK['serverUrl'].rstrip('/')
          PROJECT = TASK['projectKey']
          PULL_REQUEST = os.environ['PR_KEY']


          def api(path, parameters):
              """The answer of a SonarCloud web API call, parsed. The parameters are passed as a
              mapping and not as keyword arguments because one of them is named "from"."""
              url = '%s%s?%s' % (SERVER, path, urllib.parse.urlencode(parameters))
              request = urllib.request.Request(url,
                  headers={'Authorization': 'Bearer %s' % os.environ['SONAR_TOKEN']})
              with urllib.request.urlopen(request, timeout=120) as answer:
                  return json.load(answer)


          def wait_for_the_report():
              """The scanner submits its report and returns, the server queues it, and nothing the
              analysis found can be read back before that queued task is done."""
              deadline = time.monotonic() + 30 * 60
              while True:
                  status = api('/api/ce/task', {'id': TASK['ceTaskId']})['task']['status']
                  if status == 'SUCCESS':
                      return
                  if status in ('FAILED', 'CANCELED'):
                      sys.exit('::error::SonarCloud could not process the analysis report [%s]'
                               % status)
                  if time.monotonic() > deadline:
                      sys.exit('::error::SonarCloud is still processing the analysis report')
                  time.sleep(10)


          def reported_issues():
              """Every unresolved issue the analysis reports on the pull request, and the path of
              each file holding one. That is every issue of the files the pull request changed, the
              ones its own lines carry and the ones those files already had alike."""
              issues = []
              paths = {}
              page = 1
              while True:
                  answer = api('/api/issues/search',
                               {'componentKeys': PROJECT, 'pullRequest': PULL_REQUEST,
                                'resolved': 'false', 'ps': 500, 'p': page})
                  issues += answer['issues']
                  paths.update({component['key']: component['path']
                                for component in answer.get('components', [])
                                if 'path' in component})
                  paging = answer['paging']
                  if not answer['issues'] or page * paging['pageSize'] >= paging['total']:
                      return issues, paths
                  page += 1


          def written_lines(component, lines):
              """Which of the given lines of a file the pull request wrote. This is SonarCloud's own
              isNew flag, which it derives from the SCM data, so the verdict cannot drift from the
              diff the analysis itself reasoned about."""
              written = set()
              remaining = sorted(lines)
              while remaining:
                  ## The endpoint returns a thousand lines at most, so a file whose issues are far
                  ## apart takes several calls.
                  first, last = remaining[0], remaining[0] + 999
                  answer = api('/api/sources/lines',
                               {'key': component, 'pullRequest': PULL_REQUEST,
                                'from': first, 'to': last})
                  written.update(line['line'] for line in answer['sources'] if line.get('isNew'))
                  remaining = [line for line in remaining if line > last]
              return written


          def describe(issue, paths):
              return '%s:%s [%s] %s' % (paths.get(issue['component'], issue['component']),
                                        issue.get('line', '-'), issue['rule'], issue['message'])


          def main():
              wait_for_the_report()
              issues, paths = reported_issues()

              ## The lines are asked for one file at a time rather than one issue at a time.
              lines_of = {}
              for issue in issues:
                  if issue.get('line'):
                      lines_of.setdefault(issue['component'], set()).add(issue['line'])
              written_of = {component: written_lines(component, lines)
                            for component, lines in lines_of.items()}

              introduced = []
              inherited = []
              for issue in issues:
                  ## An issue on no line at all is an issue on the file as a whole, which no line of
                  ## the pull request can be held responsible for.
                  line = issue.get('line')
                  if line and line in written_of[issue['component']]:
                      introduced.append(issue)
                  else:
                      inherited.append(issue)

              if inherited:
                  print('::group::%d issue(s) of the changed files that this pull request did not '
                        'write' % len(inherited))
                  for issue in inherited:
                      print(describe(issue, paths))
                  print('::endgroup::')

              for issue in introduced:
                  ## A workflow command, so that the issue is annotated on its own line in the Files
                  ## changed tab instead of being buried in this log.
                  print('::error file=%s,line=%s,title=%s::%s'
                        % (paths.get(issue['component'], ''), issue['line'], issue['rule'],
                           issue['message']))

              if introduced:
                  print('::error::This pull request introduces %d SonarQube issue(s), listed above. '
                        '%s' % (len(introduced), TASK.get('dashboardUrl', SERVER)))
                  return 1
              print('No line this pull request writes carries a SonarQube issue.')
              return 0


          sys.exit(main())
          PYTHON
