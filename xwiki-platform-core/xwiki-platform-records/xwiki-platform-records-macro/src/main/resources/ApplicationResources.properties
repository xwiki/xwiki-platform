rendering.macro.records.name=Records
rendering.macro.records.description=Displays a collection of entries of the same object type, as a table readers can \
  sort and filter.

# The tabs, in this order. Without these keys they would read as the raw group ids. There is no key for the
# mandatory class parameter: it carries no group, so it is rendered as a bare field above the tab strip.
rendering.macro.records.group.columns.name=Columns
rendering.macro.records.group.filterSort.name=Filter & sort
rendering.macro.records.group.display.name=Display
rendering.macro.records.group.advanced.name=Advanced

rendering.macro.records.parameter.class.name=Object type
rendering.macro.records.parameter.class.description=The object type whose entries are listed.
rendering.macro.records.parameter.properties.name=Columns
rendering.macro.records.parameter.properties.description=The columns to display, in the order given. Page metadata \
  and the fields of the object type can be mixed. Leave empty to display the entry title followed by every field.
rendering.macro.records.parameter.properties.placeholder=Title and every field
rendering.macro.records.parameter.filters.name=Filters
rendering.macro.records.parameter.filters.description=Filters applied before readers see the table. The operator \
  is the one the field's type defines.
rendering.macro.records.parameter.filters.placeholder=Every entry
rendering.macro.records.parameter.sort.name=Sort
rendering.macro.records.parameter.sort.description=The columns the table is sorted on when the page opens, in the \
  order they apply.
rendering.macro.records.parameter.sort.placeholder=The order the object type returns
rendering.macro.records.parameter.layouts.name=Layout
rendering.macro.records.parameter.layouts.description=How the entries are laid out.
rendering.macro.records.parameter.description.name=Description
rendering.macro.records.parameter.description.description=Describes what the table lists. Shown above the table, \
  and used as its accessible description.
rendering.macro.records.parameter.id.name=Table identifier
rendering.macro.records.parameter.id.description=Identifier for this table, needed only when one page holds more \
  than one.

# The messages displayed instead of, or above, the table.
rendering.macro.records.error.noDataType=Pick an object type to display the table.
rendering.macro.records.error.dataTypeMissing=This table lists entries of the object type {0}, which no longer exists.
rendering.macro.records.error.fieldsUnreadable=The fields of the object type {0} could not be loaded. Try reloading \
  the page.
rendering.macro.records.error.renderFailed=The table could not be loaded. Try reloading the page.
rendering.macro.records.warning.columnSkipped=The field {0} no longer exists in the object type {1}, so that column \
  was skipped. Edit the macro to choose another column.
rendering.macro.records.warning.sortSkipped=The field {0} no longer exists in the object type {1}, so the table is \
  not sorted on it. Edit the macro to choose another sort.
rendering.macro.records.warning.filterSkipped=The field {0} no longer exists in the object type {1}, so the filter \
  on it was ignored. Edit the macro to choose another filter.
rendering.macro.records.warning.filterUnreadable=The filter {0} could not be read, so it was ignored. Edit the \
  macro to choose the filter again.

# The macro dialog, which loads these through the xwiki-l10n JavaScript module.
rendering.macro.records.picker.group.fields=Fields
rendering.macro.records.picker.group.metadata=Page metadata
rendering.macro.records.picker.sort.ascending=ascending
rendering.macro.records.picker.sort.descending=descending
rendering.macro.records.picker.sort.default=default order
rendering.macro.records.picker.resetWarning=Changing the object type resets the columns, the filters and the sort, \
  because they name fields of the object type you are leaving.\n\nChange it anyway?
rendering.macro.records.picker.loadFailed=The fields of {0} could not be loaded.
rendering.macro.records.picker.retry=Try again
rendering.macro.records.picker.dataTypeMissing=The object type {0} no longer exists. Pick another one to continue.
