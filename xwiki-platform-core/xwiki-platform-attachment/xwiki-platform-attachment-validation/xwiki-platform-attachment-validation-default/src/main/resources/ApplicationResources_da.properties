attachment.validation.mimetype.rejected=Wikiens administratorer har begrænset, hvilke MIME-typer bilag må have. Kontrollér, at MIME-typen for de filer, du prøver at vedhæfte, er tilladt ({0}) og ikke blokeret ({1}).
attachment.validation.filesize.rejected=Wikiens administratorer har begrænset filstørrelsen for bilag ({0} byte). Vælg en mindre fil.
attachment.validation.inputStream.error=Bilaget kan ikke valideres, fordi filen ikke kunne læses. Prøv igen senere.
attachment.validation.attachmentValidationStep.error=Bilaget kan ikke valideres, fordi validatorerne ikke kunne indlæses.
XWiki.Attachment.Validation.Code.AttachmentMimetypeRestrictionClass_allowedMimetypes=Tilladte MIME-typer
XWiki.Attachment.Validation.Code.AttachmentMimetypeRestrictionClass_allowedMimetypes_hint=Angiv listen over tilladte MIME-typer for bilag. Som standard er listen tom, men du kan angive en kommasepareret liste over tilladte MIME-typer. Bemærk, at jokertegnet (*) kan bruges til at acceptere enhver medietype. Når listen ikke er tom, afvises alle bilag med en MIME-type, der ikke står på listen. Hvis du fx kun vil acceptere almindelig tekst og alle slags billeder, kan du sætte listen til: text/plain,image/*
XWiki.Attachment.Validation.Code.AttachmentMimetypeRestrictionClass_blockedMimetypes=Blokerede MIME-typer
XWiki.Attachment.Validation.Code.AttachmentMimetypeRestrictionClass_blockedMimetypes_hint=Angiv listen over blokerede MIME-typer for bilag. Som standard er listen tom, men du kan angive en kommasepareret liste over blokerede MIME-typer. Bemærk, at jokertegnet (*) kan bruges til at ramme enhver medietype. Når listen ikke er tom, afvises alle bilag med en af MIME-typerne på listen. Hvis du fx vil afvise almindelig tekst og alle slags billeder, kan du sætte listen til: text/plain,image/*
